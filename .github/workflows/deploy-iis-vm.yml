# ─────────────────────────────────────────────────────────────────────────────
#  iNubVision Academy (ASP.NET Core 8) → IIS on an Azure Windows VM
#
#  Pull request → build + security scan
#  Push to main → build + scan → on the VM:
#                   1. enable IIS + .NET 8 Hosting Bundle (only if missing)
#                   2. write site settings from GitHub secrets (optional)
#                   3. backup → deploy → health check → automatic rollback on failure
#
#  One-time setup:
#    • Install a GitHub self-hosted runner on the VM with the label  iis-prod  (runs as SYSTEM)
#    • Create the GitHub environment  production-vm
#    • (Optional) Environment secrets: ADMIN_EMAIL, ADMIN_PASSWORD, RAZORPAY_KEY_ID,
#      RAZORPAY_KEY_SECRET, RAZORPAY_WEBHOOK_SECRET, SQL_CONNECTION
#      → written to C:\inetpub\AcademyNet\appsettings.Production.json on the VM
# ─────────────────────────────────────────────────────────────────────────────
name: CI/CD (IIS on Azure VM)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-iis-vm
  cancel-in-progress: false      # never cancel a deployment half-way

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SITE_NAME: AcademyNet
  SITE_PATH: C:\inetpub\AcademyNet
  BACKUP_ROOT: C:\inetpub\_backups\AcademyNet
  HEALTH_URL: http://localhost/health

jobs:
  # ─────────────── runs on GitHub's servers ───────────────
  build:
    name: Build & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore AcademyNet.csproj

      - name: Build
        run: dotnet build AcademyNet.csproj -c Release --no-restore

      - name: Publish
        run: dotnet publish AcademyNet.csproj -c Release --no-build -o publish

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: academy-iis
          path: publish
          retention-days: 14

  security:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'          # report only; change to '1' to block deployments on findings

  # ─────────────── runs ON the Azure Windows VM ───────────────
  deploy:
    name: Enable IIS & deploy
    needs: [build, security]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, iis-prod]
    environment:
      name: production-vm
    defaults:
      run:
        shell: powershell
    steps:
      - name: Get deploy scripts
        uses: actions/checkout@v4
        with:
          sparse-checkout: deploy/iis

      - name: Download app
        uses: actions/download-artifact@v4
        with:
          name: academy-iis
          path: publish

      # ── 1. Enable IIS (idempotent: does nothing when everything is already installed)
      - name: Enable IIS
        run: |
          $ErrorActionPreference = 'Stop'
          $features = 'Web-Server', 'Web-Default-Doc', 'Web-Static-Content', 'Web-Http-Errors',
                      'Web-Http-Logging', 'Web-Stat-Compression', 'Web-Filtering', 'Web-Mgmt-Console'
          $missing = $features | Where-Object { -not (Get-WindowsFeature $_).Installed }
          if ($missing) {
            Write-Host "Installing IIS features: $($missing -join ', ')"
            $r = Install-WindowsFeature -Name $missing -IncludeManagementTools
            if (-not $r.Success) { throw "IIS installation failed" }
            if ($r.RestartNeeded -eq 'Yes') { Write-Warning "Windows reports a restart is needed. Restart the VM if the site does not start." }
          } else {
            Write-Host "IIS is already installed."
          }

          foreach ($p in 80, 443) {
            $name = "HTTP $p (iNubVision Academy)"
            if (-not (Get-NetFirewallRule -DisplayName $name -ErrorAction SilentlyContinue)) {
              New-NetFirewallRule -DisplayName $name -Direction Inbound -Protocol TCP -LocalPort $p -Action Allow | Out-Null
              Write-Host "Opened Windows Firewall port $p"
            }
          }

      # ── 2. Install the ASP.NET Core 8 Hosting Bundle (runtime + IIS module) if missing
      - name: Install .NET 8 Hosting Bundle
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnet   = Join-Path $env:ProgramFiles 'dotnet\dotnet.exe'
          $hasRuntime = (Test-Path $dotnet) -and ((& $dotnet --list-runtimes) -match '^Microsoft\.AspNetCore\.App 8\.')
          $hasModule  = Test-Path (Join-Path $env:ProgramFiles 'IIS\Asp.Net Core Module\V2\aspnetcorev2.dll')
          if ($hasRuntime -and $hasModule) { Write-Host "Hosting Bundle 8 already installed."; exit 0 }

          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $installer = Join-Path $env:TEMP 'dotnet-hosting-8-win.exe'
          Write-Host "Downloading the .NET 8 Hosting Bundle..."
          Invoke-WebRequest -Uri 'https://dotnet.microsoft.com/permalink/dotnetcore-8-windows-runtime-bundle-installer' -OutFile $installer -UseBasicParsing
          Write-Host "Installing..."
          $p = Start-Process -FilePath $installer -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          if ($p.ExitCode -notin 0, 3010) { throw "Hosting Bundle install failed (exit code $($p.ExitCode))" }
          Write-Host "Restarting IIS so it loads the ASP.NET Core Module..."
          & net stop was /y | Out-Null
          & net start w3svc | Out-Null
          exit 0

      # ── 3. Site settings from GitHub secrets (skipped if ADMIN_EMAIL is not set, so a file you created by hand stays)
      - name: Write site settings
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_WEBHOOK_SECRET: ${{ secrets.RAZORPAY_WEBHOOK_SECRET }}
          SQL_CONNECTION: ${{ secrets.SQL_CONNECTION }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:ADMIN_EMAIL) { Write-Host "ADMIN_EMAIL secret not set - keeping the existing appsettings.Production.json."; exit 0 }

          Import-Module WebAdministration
          # Create the app pool before the first deploy, so its identity can be given read access to the file
          if (-not (Test-Path "IIS:\AppPools\$env:SITE_NAME")) {
            New-WebAppPool -Name $env:SITE_NAME | Out-Null
            Set-ItemProperty "IIS:\AppPools\$env:SITE_NAME" -Name managedRuntimeVersion -Value ''
          }

          $settings = [ordered]@{
            Admin    = [ordered]@{ Email = $env:ADMIN_EMAIL; Password = $env:ADMIN_PASSWORD }
            Razorpay = [ordered]@{ KeyId = $env:RAZORPAY_KEY_ID; KeySecret = $env:RAZORPAY_KEY_SECRET; WebhookSecret = $env:RAZORPAY_WEBHOOK_SECRET }
          }
          if ($env:SQL_CONNECTION) {
            $settings.Database = @{ Provider = 'SqlServer' }
            $settings.ConnectionStrings = @{ Default = $env:SQL_CONNECTION }
          }

          New-Item -ItemType Directory -Force -Path $env:SITE_PATH | Out-Null
          $file = Join-Path $env:SITE_PATH 'appsettings.Production.json'
          [IO.File]::WriteAllText($file, ($settings | ConvertTo-Json -Depth 5))
          # Readable only by Administrators, SYSTEM and the site's app pool
          & icacls $file /inheritance:r /grant:r 'Administrators:F' 'SYSTEM:F' "IIS AppPool\$($env:SITE_NAME):R" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not set permissions on $file" }
          Write-Host "Saved $file"

      # ── 4. Backup → deploy → health check → rollback
      - name: Backup current release
        id: backup
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path "$env:SITE_PATH\AcademyNet.dll") {
            $dest = Join-Path $env:BACKUP_ROOT (Get-Date -Format 'yyyyMMdd-HHmmss')
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            # App code only: App_Data (database + notes + keys) and appsettings.Production.json stay in place
            robocopy $env:SITE_PATH $dest /E /XD App_Data logs /XF appsettings.Production.json /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { throw "Backup failed (robocopy $LASTEXITCODE)" }
            "path=$dest" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "Backup saved to $dest"
            Get-ChildItem $env:BACKUP_ROOT -Directory | Sort-Object Name -Descending | Select-Object -Skip 5 | Remove-Item -Recurse -Force
          } else {
            Write-Host "First deployment - nothing to back up."
          }
          exit 0

      - name: Deploy to IIS
        run: |
          $ErrorActionPreference = 'Stop'
          & .\deploy\iis\2-deploy-site.ps1 -SourcePath "$env:GITHUB_WORKSPACE\publish" -SiteName $env:SITE_NAME -SitePath $env:SITE_PATH

      - name: Health check
        run: |
          for ($i = 1; $i -le 30; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $env:HEALTH_URL -UseBasicParsing -TimeoutSec 10
              if ($r.StatusCode -eq 200 -and $r.Content -match 'UP') { Write-Host "Healthy: $($r.Content)"; exit 0 }
            } catch { }
            Write-Host "Waiting for the site to start ($i/30)..."
            Start-Sleep -Seconds 5
          }
          Write-Error "Health check failed: $env:HEALTH_URL"
          exit 1

      - name: Roll back on failure
        if: failure() && steps.backup.outputs.path != ''
        run: |
          Import-Module WebAdministration
          Write-Host "Rolling back to ${{ steps.backup.outputs.path }}"
          Stop-WebAppPool -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          robocopy "${{ steps.backup.outputs.path }}" $env:SITE_PATH /E /NFL /NDL /NJH /NJS /NP | Out-Null
          Start-WebAppPool -Name $env:SITE_NAME
          Write-Host "Previous version restored."
          exit 0
